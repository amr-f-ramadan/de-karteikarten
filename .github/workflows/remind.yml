name: Erinnerung
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Sofort senden (Test)"
        type: boolean
        default: true
permissions:
  contents: write
# One reminder job at a time: a run waiting for the exact minute must finish before the next one checks sent.json
concurrency:
  group: remind
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: amr-f-ramadan/karteikarten-engine
          path: .engine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3
      - run: node .engine/tools/remind.mjs
        env:
          FORCE: ${{ github.event.inputs.force }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAPID_PUBLIC: BFZuIFPCB6Xfxe7Zh8ldo_6S9V4jIi8IskNE2ptXS6XJiHVb48SpkilWmXUOH3jwDjE9rIsFhXYL3_iy9jeiLz8
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: https://github.com/amr-f-ramadan/de-karteikarten
