<div class="wrap">
  <header><h1>Redemittel</h1></header>

<nav>
  <button data-mode="learn">Lernen<span id="badge" hidden></span></button>

</nav>
<script>
window.APP = {
  repo: "amr-f-ramadan/de-karteikarten",
  key: "kk-amr-v2",
  newPerDay: 10,
  migrate: function (p) {
    var old = JSON.parse(localStorage.getItem("kk-redemittel-known") || "null") || ["schwachstelle","ueberleben","verschlimmern","unterstellung","bemerkung","gegend","zukunft","unterstreichen","entschaedigung","zurwehr","anfuehren","aufgreifen","verbitten","unterlassen","betonen","erscheinen","verlassenauf","abkuerzung","guertellinie","wehren"];
    var now = Date.now(), d = new Date(); d.setHours(0,0,0,0);
    old.forEach(function (id, i) { p.cards[id] = { b: 2, due: d.getTime() + (1 + i % 3) * 864e5, t: now, n: 1, w: 0 }; });
  },
  t: {
    flip: "Karte umdrehen", show: "Bedeutung zeigen", again: "Nochmal", good: "Gewusst",
    sayWord: "Wort anhören", sayEx: "Beispiel anhören", whatDe: "Wie heißt das auf Deutsch?",

    syncNow: "Jetzt synchronisieren", delToken: "Token entfernen",
    st_local: "Nur auf diesem Gerät", st_syncing: "Synchronisiere …", st_ok: "Synchronisiert", st_error: "Sync fehlgeschlagen, später nochmal versuchen", st_badtoken: "Token ungültig oder abgelaufen",
